[package]
name = "python"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
action = { path = "../action" }
graph = { path = "../graph" }
execution = { path = "../execution", features = ["experimental-mixed-execution"] }
rivlet-bridge = { path = "../bridge" }
rivlet-python = { path = "../python-sdk" }
pyo3 = { version = "0.29.2", features = ["extension-module"] }
rivlet = { path = "../core" }
inspection = { path = "../inspection" }
serde_json = "1"
tokio-runtime = { path = "../tokio-runtime" }

[lints]
workspace = true
