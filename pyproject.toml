[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "rivlet"
version = "0.1.0"
description = "Explicit, composable workflows with a Python API and a Rust execution core"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []
authors = [{name = "ririv"}]
keywords = ["dag", "workflow", "task-graph", "concurrency", "rust"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/ririv/rivlet"
Repository = "https://github.com/ririv/rivlet"
Documentation = "https://github.com/ririv/rivlet/blob/main/docs/index.md"
Issues = "https://github.com/ririv/rivlet/issues"

[dependency-groups]
dev = [
    "pyright[nodejs]>=1.1.409",
    "pytest>=8.0",
    "ruff>=0.14.14",
]

[tool.maturin]
manifest-path = "crates/python/Cargo.toml"
module-name = "rivlet._native"
python-source = "src"
include = [{path = "tests/**/*", format = "sdist"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "-q"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "TC",
    "UP",
    "B",
    "C4",
    "ARG001",
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
    "ANN401",
    "RUF005",
    "RUF059",
    "RUF100",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN001",
    "ANN002",
    "ANN003",
    "ANN201",
    "ANN202",
    "ANN204",
    "ANN205",
    "ANN206",
    "ANN401",
    "ARG001",
    "TC001",
    "TC002",
    "TC003",
    "TC006",
]

[tool.pyright]
pythonVersion = "3.13"
extraPaths = ["src"]
typeCheckingMode = "standard"
reportMissingParameterType = "warning"
