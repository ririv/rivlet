<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" role="img" aria-labelledby="title description" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <title id="title">Composable subgraphs with incoming and outgoing ports</title>
  <desc id="description">Nine steps: Graph B on the left contains B1, B2, B3; Graph A in the center contains A1, A2, A3, A4; Graph C on the right contains C1, C2. A1 publishes plan-ready to B1; B2 publishes sdk-ready to A2; A3 publishes install-ready to C2. C1 prepares independently. A2 need not wait for B3, and C2 need not wait for A4. Metadata and reporting steps do not modify published artifacts. Collaboration goes both ways without a cycle in the step dependencies. Solid arrows are internal dependencies; dashed arrows are explicit port connections. Boundary intersections are not additional nodes.</desc>
  <style>
    text { fill: #243348; text-anchor: middle; }
    .title { font-size: 22px; font-weight: 500; }
    .id { font-size: 20px; font-weight: 500; }
    .detail, .legend { font-size: 14px; }
    .frame { stroke-width: 1.5; stroke-dasharray: 8 6; }
    .frame-a { fill: #f0f5fd; stroke: #83a5d6; }
    .frame-peer { fill: #f0faf4; stroke: #89b39b; }
    .step { stroke-width: 1.5; }
    .step-a { fill: #dae8fb; stroke: #8caedb; }
    .step-peer { fill: #ddf3e6; stroke: #8cb89f; }
    .order { stroke: #465366; stroke-width: 2.5; fill: none; }
    .port { stroke: #cf6b00; stroke-width: 3; stroke-dasharray: 9 6; fill: none; }
    .order-head { fill: #465366; }
    .port-head { fill: #cf6b00; }
    @media (prefers-color-scheme: dark) {
      .background { fill: #151a22; }
      text { fill: #e7edf7; }
      .frame-a { fill: #1c293e; stroke: #7e9fcf; }
      .frame-peer { fill: #1a3028; stroke: #83b199; }
      .step-a { fill: #294364; stroke: #8caedb; }
      .step-peer { fill: #284b3a; stroke: #8cb89f; }
      .order { stroke: #d0dae7; }
      .port { stroke: #ffb45b; }
      .order-head { fill: #d0dae7; }
      .port-head { fill: #ffb45b; }
    }
  </style>
  <defs>
    <marker id="order-arrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="12" refX="12" refY="6" orient="auto">
      <path class="order-head" d="M0 0 L12 6 L0 12 Z"/>
    </marker>
    <marker id="port-arrow" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="12" refX="12" refY="6" orient="auto">
      <path class="port-head" d="M0 0 L12 6 L0 12 Z"/>
    </marker>
  </defs>
  <rect class="background" width="900" height="620" rx="12" fill="#ffffff"/>
  <rect class="frame frame-peer" x="20" y="20" width="210" height="440" rx="24"/>
  <rect class="frame frame-a" x="330" y="20" width="240" height="550" rx="24"/>
  <rect class="frame frame-peer" x="670" y="20" width="210" height="440" rx="24"/>
  <text class="title" x="125" y="60">Graph B</text>
  <text class="title" x="450" y="60">Graph A</text>
  <text class="title" x="775" y="60">Graph C</text>
  <g class="order" marker-end="url(#order-arrow)">
    <line x1="450" y1="165" x2="450" y2="219"/>
    <line x1="450" y1="295" x2="450" y2="349"/>
    <line x1="450" y1="425" x2="450" y2="479"/>
    <line x1="125" y1="165" x2="125" y2="219"/>
    <line x1="125" y1="295" x2="125" y2="349"/>
    <line x1="775" y1="165" x2="775" y2="349"/>
  </g>
  <g class="port" marker-end="url(#port-arrow)">
    <line x1="371" y1="127" x2="204" y2="127"/>
    <line x1="204" y1="257" x2="371" y2="257"/>
    <line x1="529" y1="387" x2="696" y2="387"/>
  </g>
  <g>
    <rect class="step step-a" x="375" y="95" width="150" height="64" rx="15"/>
    <text class="id" x="450" y="123">A1</text>
    <text class="detail" x="450" y="145">plan-ready</text>
    <rect class="step step-a" x="375" y="225" width="150" height="64" rx="15"/>
    <text class="id" x="450" y="253">A2</text>
    <text class="detail" x="450" y="275">sdk input</text>
    <rect class="step step-a" x="375" y="355" width="150" height="64" rx="15"/>
    <text class="id" x="450" y="383">A3</text>
    <text class="detail" x="450" y="405">install-ready</text>
    <rect class="step step-a" x="375" y="485" width="150" height="64" rx="15"/>
    <text class="id" x="450" y="513">A4</text>
    <text class="detail" x="450" y="535">write report</text>
    <rect class="step step-peer" x="50" y="95" width="150" height="64" rx="15"/>
    <text class="id" x="125" y="123">B1</text>
    <text class="detail" x="125" y="145">plan input</text>
    <rect class="step step-peer" x="50" y="225" width="150" height="64" rx="15"/>
    <text class="id" x="125" y="253">B2</text>
    <text class="detail" x="125" y="275">sdk-ready</text>
    <rect class="step step-peer" x="50" y="355" width="150" height="64" rx="15"/>
    <text class="id" x="125" y="383">B3</text>
    <text class="detail" x="125" y="405">record metadata</text>
    <rect class="step step-peer" x="700" y="95" width="150" height="64" rx="15"/>
    <text class="id" x="775" y="123">C1</text>
    <text class="detail" x="775" y="145">prepare environment</text>
    <rect class="step step-peer" x="700" y="355" width="150" height="64" rx="15"/>
    <text class="id" x="775" y="383">C2</text>
    <text class="detail" x="775" y="405">install input</text>
  </g>
  <line class="order" x1="242" y1="598" x2="272" y2="598" marker-end="url(#order-arrow)"/>
  <text class="legend" x="346" y="603">Internal dependency</text>
  <line class="port" x1="460" y1="598" x2="496" y2="598" marker-end="url(#port-arrow)"/>
  <text class="legend" x="572" y="603">Port connection</text>
</svg>
