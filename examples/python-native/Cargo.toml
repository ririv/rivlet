[package]
name = "rivlet-native-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false

[workspace]

[lib]
name = "demo_native"
crate-type = ["cdylib"]

[dependencies]
action = { path = "../../crates/action" }
graph = { path = "../../crates/graph" }
rivlet-python = { path = "../../crates/python-sdk" }
pyo3 = { version = "0.29.2", features = ["extension-module"] }

[lints.rust]
unsafe_code = "forbid"
