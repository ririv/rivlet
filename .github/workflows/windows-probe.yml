name: Windows wheel probe

on:
  push:
    branches: ['codex/windows-wheel-probe-20261107']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.95.0 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.95.0
      - name: Install build and test tools
        run: python -m pip install 'maturin==1.15.0' 'pytest>=8' 'twine>=6'
      - name: Check release identity
        run: python scripts/check_release.py
      - name: Build Windows wheel
        id: build
        run: maturin build --target x86_64-pc-windows-msvc --release --locked --interpreter python --out dist
      - name: Install and verify wheel
        run: |
          python -c "import pathlib, subprocess, sys; wheels = list(pathlib.Path('dist').glob('*.whl')); assert len(wheels) == 1, wheels; subprocess.run([sys.executable, '-m', 'pip', 'install', '--no-deps', str(wheels[0])], check=True); subprocess.run([sys.executable, '-m', 'twine', 'check', '--strict', str(wheels[0])], check=True)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -I -c "import importlib.metadata, pathlib, tomllib, rivlet; assert importlib.metadata.version('rivlet') == tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']; print(rivlet.__file__)"
      - name: Test Rust core on Windows
        run: cargo test --locked --workspace --exclude python
      - name: Test installed wheel on Windows
        run: python -I -m pytest tests -ra --junitxml=windows-results.xml
      - name: Upload candidate and test report
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-candidate-${{ matrix.python }}
          path: |
            dist/*.whl
            windows-results.xml
          if-no-files-found: error
          retention-days: 7
