name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      rust: ${{ steps.settings.outputs.rust }}
      maturin: ${{ steps.settings.outputs.maturin }}
      python: ${{ steps.settings.outputs.python }}
      sdist: ${{ steps.settings.outputs.sdist }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Read shared release settings
        id: settings
        run: python scripts/build_dist.py settings >> "$GITHUB_OUTPUT"
      - name: Check release identity
        run: python scripts/check_release.py
      - name: Install build and check tools
        run: python -m pip install 'maturin==${{ steps.settings.outputs.maturin }}' 'ruff>=0.14.14' 'pyright[nodejs]>=1.1.409' 'pytest>=8' 'twine>=6'
      - name: Check Python declarations
        run: |
          ruff check src scripts tests benchmarks
          pyright src scripts
      - name: Check Rust core
        run: |
          rustup toolchain install ${{ steps.settings.outputs.rust }} --profile minimal --component clippy
          cargo +${{ steps.settings.outputs.rust }} test --locked --workspace --exclude python
          cargo +${{ steps.settings.outputs.rust }} clippy --locked --workspace --all-targets -- -D warnings
      - name: Build and verify source distribution
        run: |
          python scripts/build_dist.py sdist dist
          python scripts/build_dist.py verify-source dist/${{ steps.settings.outputs.sdist }} dist/receipts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source
          path: dist/
          if-no-files-found: error

  wheels:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        python: ${{ fromJSON(needs.source.outputs.python) }}
        platform:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: windows-2022
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: source
          path: source-dist
      - name: Install build and verification tools
        run: python -m pip install 'maturin==${{ needs.source.outputs.maturin }}' 'pytest>=8' 'twine>=6'
      - name: Prepare native Rust toolchain
        if: runner.os != 'Linux'
        run: rustup toolchain install ${{ needs.source.outputs.rust }} --profile minimal
      - name: Build Linux wheel in manylinux container
        if: runner.os == 'Linux'
        run: python scripts/build_dist.py container source-dist/${{ needs.source.outputs.sdist }} dist --python-version ${{ matrix.python }}
      - name: Build native wheel from the same source distribution
        if: runner.os != 'Linux'
        run: python scripts/build_dist.py native source-dist/${{ needs.source.outputs.sdist }} dist --target ${{ matrix.platform.target }} --interpreter python
      - name: Test Rust core on Windows
        if: runner.os == 'Windows'
        run: cargo +${{ needs.source.outputs.rust }} test --locked --workspace --exclude python
      - name: Test installed wheel
        run: python scripts/verify_wheel.py --dist dist --receipts dist/receipts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.platform.target }}-${{ matrix.python }}
          path: dist/
          if-no-files-found: error

  publish:
    needs: [source, wheels]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/rivlet
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Check verification records and stage immutable candidates
        run: |
          python -m pip install 'twine>=6'
          python scripts/publish_dist.py stage dist dist/receipts upload
      - name: Publish verified distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: upload/
