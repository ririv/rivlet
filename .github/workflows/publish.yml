name: publish

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check release identity
        run: python scripts/check_release.py
      - name: Install build and check tools
        run: python -m pip install 'maturin==1.15.0' 'ruff>=0.14.14' 'pyright[nodejs]>=1.1.409' 'pytest>=8' 'twine>=6'
      - name: Check Python declarations
        run: |
          ruff check src scripts tests benchmarks
          pyright src scripts
      - name: Check Rust core
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy
          rustup default 1.95.0
          cargo +1.95.0 test --locked --workspace --exclude python
          cargo +1.95.0 clippy --locked --workspace --all-targets -- -D warnings
      - name: Build and verify source distribution
        run: |
          maturin sdist --out dist
          python -m twine check --strict dist/*
          python -m pip wheel --no-deps dist/*.tar.gz --wheel-dir /tmp/rivlet-source-wheel
          python -m pip install --no-deps /tmp/rivlet-source-wheel/*.whl
          python -I -m pytest tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    needs: source
    strategy:
      fail-fast: false
      matrix:
        python: ['3.13', '3.14', '3.15']
        platform:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Build wheel
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: ${{ matrix.platform.target }}
          manylinux: '2_28'
          maturin-version: 'v1.15.0'
          rust-toolchain: '1.95.0'
          args: --release --locked --interpreter python${{ matrix.python }} --out dist
      - name: Test installed wheel
        run: |
          python -m pip install --only-binary :all: dist/*.whl 'pytest>=8' 'twine>=6'
          python -m twine check --strict dist/*
          python -I -c "import importlib.metadata, pathlib, tomllib, rivlet; assert importlib.metadata.version('rivlet') == tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; print(rivlet.__file__)"
          python -I -m pytest tests
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-${{ matrix.platform.target }}-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    needs: [source, wheels]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/rivlet
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish verified distributions
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
