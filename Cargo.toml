[workspace]
members = [
    "crates/core",
    "crates/python",
    "crates/rivlet",
    "crates/tokio-runtime",
]
exclude = ["crates/node"]
resolver = "3"

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/ririv/rivlet"

[workspace.dependencies]
rivlet-core = { path = "crates/core", version = "=0.6.0" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
